version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: films
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    restart: always

  backend:
    image: ghcr.io/duckpicker/film-react-nest/backend:latest
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/films
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      LOG_TYPE: json
    networks:
      - app-network
    restart: always

  nginx:
    image: ghcr.io/duckpicker/film-react-nest/nginx:latest
    ports:
      - "80:80"
    networks:
      - app-network
    restart: always

volumes:
  pg-data:
  pgadmin-data:

networks:
  app-network: