version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: films
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      app-network:
        ipv4_address: 172.18.0.10
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    restart: always

  backend:
    image: ghcr.io/duckpicker/film-react-nest/backend:latest
    container_name: backend_container
    extra_hosts:
      - "postgres:172.18.0.10"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: films
      DATABASE_DRIVER: postgres
      LOG_TYPE: json
    networks:
      - app-network
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: ghcr.io/duckpicker/film-react-nest/nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: always

volumes:
  pg-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16